[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yupyter"
version = "0.0.1"
description = "A zen-mode notebook on the Jupyter kernel ecosystem, with markdown files, multiplayer editing and agents."
readme = "plans/poc.md"
requires-python = ">=3.10"
dependencies = [
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "pycrdt>=0.12",
  "claude-agent-sdk>=0.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "matplotlib>=3.8"]

[project.scripts]
yupyter = "yupyter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yupyter"]
artifacts = ["yupyter/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["yupyter", "frontend", "hatch_build.py", "plans", "tests"]
exclude = ["frontend/node_modules", "frontend/dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
